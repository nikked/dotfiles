# Based on https://raine.dev/blog/my-tmux-setup/

# ==============================================================================
# CORE SETTINGS
# ==============================================================================

# Prefix configuration
unbind C-b
set-option -g prefix C-f
bind-key a send-prefix

# General behavior
set -g base-index 1                  # Start window indexing at 1
set-option -g renumber-windows on    # Renumber windows when one is closed
set -g detach-on-destroy off         # Don't detach when killing a session
set -g mouse off                     # Disable mouse
set -s escape-time 0                 # No delay for escape key press
set-option -g display-time 4000      # Duration of status messages
set-option -g focus-events on        # Focus events enabled for terminals that support it
setw -g mode-keys vi                 # Vi key bindings in copy mode
setw -g aggressive-resize on         # Aggressive resize for shared sessions
set -g main-pane-width 110           # Main pane width for specific layouts

# ==============================================================================
# TERMINAL & COLOR SUPPORT
# ==============================================================================

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Undercurl & Underscore colors support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ==============================================================================
# CLIPBOARD
# ==============================================================================

set -g set-clipboard on

# ==============================================================================
# APPEARANCE
# ==============================================================================


# Color for active and inactive panes
set-window-option -g window-style 'bg=#1e2030'
set-window-option -g window-active-style 'bg=#24273a'

set -g pane-border-style fg=#494d64,bg=#1e2030
set -g pane-active-border-style fg=#939ab7,bg=#24273a

# Status bar config
set -g status-bg '#181926'
set -g status-fg '#939ab7'
set -g status-left '#[fg=#939ab7]#S '
set -g status-right '#[fg=#939ab7]%d.%m. %H:%M'
set-window-option -g window-status-current-style fg=#181926,bg=#939ab7

set-window-option -g window-status-style fg=#6e738d,bg=#181926
set-window-option -g window-status-current-format ' #I:#W '


# ==============================================================================
# KEY BINDINGS
# ==============================================================================

# Config Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf


# Window management (Vim inspired)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Close pane
bind c kill-pane

# New window
bind t new-window -c "#{pane_current_path}"

# Resize panes
bind < resize-pane -L 10
bind > resize-pane -R 10
bind + resize-pane -D 10
bind - resize-pane -U 10


# Equalize all panes to same size
bind = select-layout -E
# After splitting window, equalize all panes
set-hook -g after-split-window "select-layout -E"

# Navigation
bind -n F11 previous-window
bind -n F12 next-window
bind m choose-tree
bind k choose-session

# Swap windows
# Reorder windows with ctrl shift arrow, no prefix needed
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Window chooser
bind Tab choose-window

# Copy Mode (Vim-like)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Session Management
unbind S
bind S command-prompt 'rename-session %%'
bind N new-session
# Create new session from current window
bind B command-prompt -p "New session name:" "new-session -d -s '%%'; move-window -t '%%:'; switch-client -t '%%'"


# ==============================================================================
# CUSTOM POPUPS & SCRIPTS
# ==============================================================================

# List all sessions and choose from them
# Ctrl f + ctrl j
bind C-j display-popup -h 15 -w 30 -E "tmux-session-switcher"

# List recent directories, selecting opens new tmux window
# Ctrl f + ctrl o
bind C-o display-popup -E "tmux-zoxide-window"

bind C-t display-popup -E "tmux-bro" # New session from a list of projects (or cd)

# File Pickers
bind C-f display-popup -h 60% -w 60% -E "tmux-file-picker" # Insert the selected path into the active pane
bind C-r display-popup -h 60% -w 60% -E "tmux-file-picker -d"
bind C-g display-popup -h 60% -w 60% -E "tmux-file-picker -g"
bind C-d display-popup -h 60% -w 60% -E "tmux-file-picker --zoxide --dir-only"
bind C-z display-popup -h 60% -w 60% -E "tmux-file-picker --zoxide"



# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
